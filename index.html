    <!-- Open Graph (social preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Business Command Center" />
    <meta
      property="og:description"
      content="Plan at the center, departments around it, AI doing the work, you making the decisions."
    />
    <meta property="og:url" content="https://integrityrising101.github.io/business-command-center/" />
    <meta property="og:image" content="/business-command-center/og-image.png" />
    <meta property="og:site_name" content="Business Command Center" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Business Command Center" />
    <meta
      name="twitter:description"
      content="A business operating system for one person. Plan, work, money, products, audience, agents."
    />

    <!-- Favicons (drop your own files in /public) -->
    <link rel="icon" type="image/svg+xml" href="/business-command-center/favicon.svg" />
    <link rel="apple-touch-icon" href="/business-command-center/apple-touch-icon.png" />
    <link rel="manifest" href="/business-command-center/manifest.webmanifest" />

    <!-- Fonts: Inter for UI, JetBrains Mono for numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-brand-bg text-white antialiased">
    <!-- Root -->
    <div id="root"></div>

    <!-- No-JS fallback -->
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #e2e8f0; background: #0f172a;">
        <h1 style="color: #38bdf8;">Business Command Center</h1>
        <p>This app needs JavaScript enabled. Please turn it on and reload.</p>
      </div>
    </noscript>

    <!-- SPA redirect restore (works with public/404.html) -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          var target = new URL(redirect).pathname;
          var base = '/business-command-center';
          if (target.indexOf(base) === 0) {
            target = target.slice(base.length) || '/';
          }
          history.replaceState(null, '', base + target);
        }
      })();
    </script>

    <!-- App entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
