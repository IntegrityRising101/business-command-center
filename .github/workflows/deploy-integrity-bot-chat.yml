name: Deploy Integrity Bot Chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/integrity-bot-chat/**'
      - '.github/workflows/deploy-integrity-bot-chat.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Supabase deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          # Remove accidental leading/trailing whitespace or line breaks from a pasted GitHub secret.
          SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export SUPABASE_ACCESS_TOKEN
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo "Supabase Personal Access Token prefix detected; character count: ${#SUPABASE_ACCESS_TOKEN}." ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN must contain the actual Supabase Personal Access Token beginning with sbp_. Do not use the token display name or an API key."; exit 1 ;;
          esac
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_ID."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "hdbmdhhfaeuszylarfkk" ]; then
            echo "::error::SUPABASE_PROJECT_ID does not match the Integrity Rising Supabase project."
            exit 1
          fi
          echo "Supabase deployment secrets are present."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy integrity-bot-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy integrity-bot-chat --project-ref "$SUPABASE_PROJECT_ID" --yes
