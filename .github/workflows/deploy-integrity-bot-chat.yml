name: Deploy Integrity Bot Chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/integrity-bot-chat/**'
      - '.github/workflows/deploy-integrity-bot-chat.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy integrity-bot-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy integrity-bot-chat --project-ref "$SUPABASE_PROJECT_ID"
